name: Stable Keel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-current-curatoros:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate current CuratorOS surface
        run: npm run check

# Production deployment is owned by Cloudflare Pages.
# Stable Keel validates the repository; it does not package or deploy the retired standalone Worker.
