name: Sync Search Visibility
on:
  workflow_dispatch:
  schedule:
    - cron: '42 13 * * *'
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch settled GSC performance and update CuratorOS
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SEARCH_VISIBILITY_INGEST_TOKEN: ${{ secrets.SEARCH_VISIBILITY_INGEST_TOKEN }}
        run: node scripts/sync-search-visibility.mjs
