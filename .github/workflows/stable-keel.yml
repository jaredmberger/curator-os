name: Stable Keel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-current-curatoros:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate current CuratorOS surface
        run: npm run check

# Production deployment is owned by Cloudflare Pages.
# Stable Keel validates the repository; it does not package or deploy the retired standalone Worker.

  staging-anonymous-auth-denial:
    if: github.event_name == 'pull_request' && github.head_ref == 'staging/stewardship-auth-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Verify no unauthenticated preview access
        shell: bash
        run: |
          set -euo pipefail
          target='https://staging-stewardship-auth-int.curator-os.pages.dev/api/stewardship-auth-test'
          status=$(curl --silent --show-error --max-time 20 --max-redirs 0 -o /tmp/stewardship-auth-response -w '%{http_code}' "$target")
          echo "Anonymous HTTP status: $status"
          if grep -Eq '"authorized"\s*:\s*true|"kind"\s*:\s*"stewardship-auth-test"' /tmp/stewardship-auth-response; then
            echo 'FAIL: anonymous access exposed staging sentinel'
            exit 1
          fi
          case "$status" in
            302|303|401|403) echo 'PASS: anonymous visitor challenged or denied' ;;
            *) echo 'FAIL: Access challenge/denial not established'; exit 1 ;;
          esac
