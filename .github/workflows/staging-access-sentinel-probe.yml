name: Staging Access Sentinel Probe
on:
  push:
    branches:
      - staging/stewardship-access-sentinel
    paths:
      - '.github/workflows/staging-access-sentinel-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unauthenticated:
    runs-on: ubuntu-latest
    steps:
      - name: Probe fixed staging alias with no credentials
        shell: bash
        run: |
          set -euo pipefail
          url='https://staging-stewardship-access-s.curator-os.pages.dev/api/stewardship-access-sentinel'
          code=$(curl --silent --show-error --max-time 15 -o /tmp/stewardship-probe-body -w '%{http_code}' "$url" || true)
          echo "Unauthenticated HTTP status: $code"
          if grep -Fq '"kind":"stewardship-access-sentinel"' /tmp/stewardship-probe-body 2>/dev/null; then
            echo 'ACCESS_BOUNDARY_RESULT=PUBLIC_SENTINEL_REACHABLE'
            echo 'FAIL: unauthenticated caller reached staging sentinel'
            exit 1
          else
            echo 'ACCESS_BOUNDARY_RESULT=SENTINEL_NOT_OBSERVED'
            if [[ "$code" != 302 && "$code" != 303 && "$code" != 401 && "$code" != 403 ]]; then
              echo 'INCONCLUSIVE: response was not an expected Access denial/challenge'
              exit 1
            fi
          fi
          echo 'This is a measurement only, not proof of authorization.'
