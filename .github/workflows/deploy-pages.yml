name: Deploy CuratorOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CuratorOS repository
        uses: actions/checkout@v4

      - name: Check out Ocean Liner Curator website
        uses: actions/checkout@v4
        with:
          repository: jaredmberger/Ocean-Liner-Curator
          ref: main
          path: _oceanliners

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare production site artifact
        run: |
          rm -rf _site
          mkdir -p _site/link-map

          # CuratorOS is composed of many cooperating preview modules/styles.
          # Publish the complete application instead of a small legacy subset.
          rsync -a preview/ _site/

          # preview/index.html references shared core/style assets at /src/.
          mkdir -p _site/src
          rsync -a src/ _site/src/

          # Build the Link Map from the public Ocean Liner Curator repository.
          cp link-map/static-index.html _site/link-map/index.html
          node scripts/build-link-map-data.js _oceanliners _site/link-map/link-map-data.json

          touch _site/.nojekyll

          # Fail the deployment early if canonical record assets are missing.
          test -f _site/project-records-store.js
          test -f _site/records-browser.js
          test -f _site/record-editing.js
          test -f _site/ship-record.js
          test -f _site/ship-record.css
          test -f _site/src/core/database.js
          test -f _site/src/core/storage.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
