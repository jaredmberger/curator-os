<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1110">
<title>Link Map — CuratorOS</title>
<meta name="description" content="Visualize and audit internal links across Ocean Liner Curator.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{color-scheme:dark;--bg:#0a1110;--panel:#111a18;--panel2:#17221f;--line:#2b3a35;--text:#f3efe5;--muted:#b7b6ad;--brass:#bfa46a;--danger:#d17979;--good:#8db68f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#17221f 0,#0a1110 42%,#070c0b 100%);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}.topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(10,17,16,.94);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px}.flag{width:34px;height:22px;background:#8f1f24;clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%)}.brand strong{font-family:Georgia,serif;font-size:1.08rem}.brand span{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer;text-decoration:none}.btn:hover,.btn:focus-visible{border-color:var(--brass);outline:none}.btn.primary{background:var(--brass);color:#17130c;border-color:var(--brass);font-weight:700}.controls{display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(3,minmax(140px,.55fr));gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:#0d1513}.control{display:flex;flex-direction:column;gap:5px}.control label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.control input,.control select{width:100%;background:#111a18;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}.graph-wrap{position:relative;min-height:70vh}.graph{position:absolute;inset:0}.status{position:absolute;left:16px;bottom:16px;background:rgba(10,17,16,.9);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--muted);font-size:.82rem;backdrop-filter:blur(10px);z-index:5}.sidebar{border-left:1px solid var(--line);background:rgba(14,22,20,.94);padding:18px;overflow:auto;max-height:calc(100vh - 122px)}.sidebar h2,.sidebar h3{font-family:Georgia,serif;margin:0 0 8px}.sidebar p{color:var(--muted);line-height:1.45}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.metric strong{display:block;font-size:1.35rem}.metric span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.list{display:grid;gap:7px;margin:10px 0 18px}.link-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:9px}.link-row button{all:unset;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:.68rem;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--muted);white-space:nowrap}.audit{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.audit-table{width:100%;border-collapse:collapse;font-size:.78rem}.audit-table th,.audit-table td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}.audit-table th{color:var(--muted);font-weight:600}.risk-critical{color:var(--danger)}.risk-weak{color:#d9b16c}.risk-healthy{color:var(--good)}.empty{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:var(--muted)}.loader{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(58vh,1fr) auto}.sidebar{border-left:0;border-top:1px solid var(--line);max-height:none}.topbar{align-items:flex-start}.brand span{max-width:180px}.actions{justify-content:flex-end}}@media(max-width:560px){.topbar,.controls{padding-left:12px;padding-right:12px}.controls{grid-template-columns:1fr}.actions .btn:not(.primary){display:none}.workspace{grid-template-rows:62vh auto}.sidebar{padding:14px}.metrics{grid-template-columns:repeat(4,1fr)}.metric{padding:8px 6px}.metric strong{font-size:1.05rem}.metric span{font-size:.6rem}}
</style>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="flag" aria-hidden="true"></div><div><strong>CuratorOS Link Map</strong><span>Ocean Liner Curator internal-link graph</span></div></div><div class="actions"><a class="btn" href="/">CuratorOS</a><button class="btn" id="fitBtn">Fit graph</button><button class="btn" id="exportBtn">Export CSV</button><button class="btn primary" id="refreshBtn">Reload map</button></div></header>
<section class="controls" aria-label="Graph controls"><div class="control"><label for="search">Find page</label><input id="search" type="search" placeholder="RMS Olympic, Titanic, /ships/…"></div><div class="control"><label for="view">View</label><select id="view"><option value="all">Whole site</option><option value="incoming">Incoming links</option><option value="outgoing">Outgoing links</option><option value="weak">Weakly linked pages</option></select></div><div class="control"><label for="group">Group</label><select id="group"><option value="all">All page types</option><option value="ship">Ship guides</option><option value="hub">Hubs / indexes</option><option value="article">Articles / answers</option><option value="core">Core pages</option><option value="other">Other</option></select></div><div class="control"><label for="minLinks">Minimum total links</label><select id="minLinks"><option value="0">Any</option><option value="1">1+</option><option value="3">3+</option><option value="6">6+</option><option value="10">10+</option></select></div></section>
<main class="workspace"><section class="graph-wrap"><div id="graph" class="graph"><div class="empty"><div><div class="loader"></div>Loading link map…</div></div></div><div class="status" id="status">Loading graph data…</div></section><aside class="sidebar" id="sidebar"><h2>Site overview</h2><p>Select a page to inspect incoming and outgoing internal links.</p><div class="metrics" id="overviewMetrics"></div><div class="audit"><h3>Weakest pages</h3><div id="weakList"></div></div></aside></main>
</div>
<script>
const SITE='https://oceanliners.net';let data=null,cy=null,selectedId=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function typeFor(url){const p=new URL(url).pathname.toLowerCase();if(p.startsWith('/ships/')&&p!='/ships/ships')return'ship';if(p.includes('hub')||p==='/ships/ships'||p==='/explore'||p==='/site-map')return'hub';if(p.includes('/quick-answer')||p.includes('/articles/')||p.includes('/history/')||(/why-|what-|how-|did-|could-|ocean-liner/.test(p.split('/').pop()||'')))return'article';if(['/','/about','/sources','/provenance','/attribution','/contact','/project-scope'].includes(p.replace(/\/$/,'')||'/'))return'core';return'other'}
function labelFor(p){return p.title||new URL(p.url).pathname||'/'}function riskFor(n){if(n===0)return['Critical','risk-critical'];if(n<=2)return['Weak','risk-weak'];if(n<=5)return['Fair',''];return['Healthy','risk-healthy']}
async function load(){try{$('#status').textContent='Loading graph data…';const res=await fetch('./link-map-data.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('Graph data returned '+res.status);data=await res.json();render()}catch(err){$('#graph').innerHTML='<div class="empty"><div><h2>Link map could not load</h2><p>'+esc(err.message)+'</p></div></div>';$('#status').textContent='Data unavailable'}}
function render(){const incoming=new Map(),outgoing=new Map();for(const p of data.pages){incoming.set(p.url,[]);outgoing.set(p.url,[])}for(const e of data.edges){outgoing.get(e.source)?.push(e.target);incoming.get(e.target)?.push(e.source)}for(const p of data.pages){p.incoming=incoming.get(p.url)||[];p.outgoing=outgoing.get(p.url)||[];p.total=p.incoming.length+p.outgoing.length;p.type=typeFor(p.url)}const elements=[...data.pages.map(p=>({data:{id:p.url,label:labelFor(p),type:p.type,total:p.total}})),...data.edges.map((e,i)=>({data:{id:'e'+i,source:e.source,target:e.target}}))];$('#graph').innerHTML='';cy=cytoscape({container:$('#graph'),elements,style:[{selector:'node',style:{'background-color':'#bfa46a','label':'data(label)','font-size':9,'color':'#f3efe5','text-outline-color':'#0a1110','text-outline-width':2,'width':'mapData(total,0,30,18,52)','height':'mapData(total,0,30,18,52)'}},{selector:'node[type="hub"]',style:{'background-color':'#d7c391','shape':'diamond'}},{selector:'node[type="article"]',style:{'background-color':'#8e7ac8'}},{selector:'node[type="core"]',style:{'background-color':'#8db68f','shape':'round-rectangle'}},{selector:'edge',style:{'width':1,'line-color':'#3d514a','target-arrow-color':'#3d514a','target-arrow-shape':'triangle','curve-style':'bezier','opacity':.42}},{selector:'.dim',style:{'opacity':.08}},{selector:'.focus',style:{'border-width':3,'border-color':'#fff','z-index':9999}},{selector:'.connected',style:{'opacity':1}},{selector:'edge.connected',style:{'width':2,'line-color':'#bfa46a','target-arrow-color':'#bfa46a','opacity':.9}}],layout:{name:'cose',animate:false,fit:true,padding:36,nodeRepulsion:9000,idealEdgeLength:85,edgeElasticity:.12,gravity:.22,numIter:1000}});cy.on('tap','node',e=>selectNode(e.target.id()));cy.on('tap',e=>{if(e.target===cy){selectedId=null;applyFilters();renderOverview()}});applyFilters();renderOverview();$('#status').textContent=`${data.pages.length} pages · ${data.edges.length} internal links · built ${new Date(data.generatedAt).toLocaleString()}`}
function rows(ids,kind){if(!ids.length)return'<p>No pages found.</p>';return ids.map(id=>{const p=data.pages.find(x=>x.url===id);return`<div class="link-row"><button data-page="${esc(id)}">${esc(p?labelFor(p):id)}</button><span class="badge">${kind}</span></div>`}).join('')}
function opportunities(p){const direct=new Set([...p.incoming,...p.outgoing,p.url]),neighbors=new Set([...p.incoming,...p.outgoing]);return data.pages.filter(q=>q.url!==p.url&&q.type===p.type&&!direct.has(q.url)).map(q=>({q,score:[...q.incoming,...q.outgoing].filter(n=>neighbors.has(n)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||b.q.total-a.q.total).map(x=>x.q.url)}
function selectNode(id){selectedId=id;applyFilters();const p=data.pages.find(x=>x.url===id);if(!p)return;const [risk,klass]=riskFor(p.incoming.length);$('#sidebar').innerHTML=`<h2>${esc(labelFor(p))}</h2><p>${esc(new URL(p.url).pathname)}</p><div class="metrics"><div class="metric"><strong>${p.incoming.length}</strong><span>Incoming</span></div><div class="metric"><strong>${p.outgoing.length}</strong><span>Outgoing</span></div><div class="metric"><strong>${p.total}</strong><span>Total</span></div><div class="metric"><strong class="${klass}">${risk}</strong><span>Status</span></div></div><p><a class="btn" target="_blank" rel="noopener" href="${esc(p.url)}">Open page</a></p><h3>Linked from</h3><div class="list">${rows(p.incoming,'incoming')}</div><h3>Links to</h3><div class="list">${rows(p.outgoing,'outgoing')}</div><div class="audit"><h3>Potential connections</h3><p>Same-type pages that share graph neighbors but do not directly link.</p><div class="list">${rows(opportunities(p).slice(0,12),'opportunity')}</div></div>`;bindRows()}
function bindRows(){$('#sidebar').querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{selectNode(b.dataset.page);const n=cy.$id(b.dataset.page);if(n.length)cy.animate({center:{eles:n},duration:250})}))}
function applyFilters(){if(!cy)return;cy.elements().removeClass('dim focus connected');const group=$('#group').value,min=Number($('#minLinks').value),view=$('#view').value,q=$('#search').value.trim().toLowerCase();cy.nodes().forEach(n=>{const p=data.pages.find(x=>x.url===n.id());let show=(group==='all'||p.type===group)&&p.total>=min&&(!q||(labelFor(p)+' '+p.url).toLowerCase().includes(q));if(view==='weak')show=show&&p.incoming.length<=2;if((view==='incoming'||view==='outgoing')&&!selectedId)show=false;n.toggleClass('dim',!show)});if(selectedId){const focus=cy.$id(selectedId);focus.addClass('focus connected').removeClass('dim');let neighborhood;if(view==='incoming')neighborhood=focus.incomers();else if(view==='outgoing')neighborhood=focus.outgoers();else neighborhood=focus.closedNeighborhood();neighborhood.addClass('connected').removeClass('dim');if(view==='incoming'||view==='outgoing')cy.elements().not(neighborhood).addClass('dim')}}
function renderOverview(){const orphan=data.pages.filter(p=>p.incoming.length===0).length,weak=data.pages.filter(p=>p.incoming.length<=2).length;$('#sidebar').innerHTML=`<h2>Site overview</h2><p>Select a page to inspect incoming and outgoing internal links.</p><div class="metrics"><div class="metric"><strong>${data.pages.length}</strong><span>Pages</span></div><div class="metric"><strong>${data.edges.length}</strong><span>Links</span></div><div class="metric"><strong>${orphan}</strong><span>No inbound</span></div><div class="metric"><strong>${weak}</strong><span>Weak ≤2</span></div></div><div class="audit"><h3>Weakest pages</h3><div class="list">${rows([...data.pages].sort((a,b)=>a.incoming.length-b.incoming.length||a.total-b.total).slice(0,20).map(p=>p.url),'audit')}</div></div>`;bindRows()}
function exportCsv(){const lines=[['Title','URL','Type','Incoming','Outgoing','Total','Status'],...data.pages.map(p=>[labelFor(p),p.url,p.type,p.incoming.length,p.outgoing.length,p.total,riskFor(p.incoming.length)[0]])];const csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='oceanliners-internal-link-audit.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#fitBtn').addEventListener('click',()=>cy?.fit(undefined,35));$('#exportBtn').addEventListener('click',exportCsv);$('#refreshBtn').addEventListener('click',()=>location.reload());['search','view','group','minLinks'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',applyFilters));load();
</script>
</body></html>
