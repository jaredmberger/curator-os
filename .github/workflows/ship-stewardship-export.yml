name: Ship Stewardship Archive Export
on:
  workflow_dispatch:
    inputs:
      publish_verified_snapshot:
        description: 'Publish validated export to protected KV (requires scoped credentials and configured namespace)'
        type: boolean
        default: false
        required: true
  pull_request:
    paths:
      - '.github/workflows/ship-stewardship-export.yml'
      - 'tools/stewardship/**'
      - 'tests/stewardship-ship-export.test.mjs'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CuratorOS inventory generator
        uses: actions/checkout@v4
        with:
          path: curator-os
      - name: Checkout authoritative Ocean Liner Curator archive
        uses: actions/checkout@v4
        with:
          repository: jaredmberger/Ocean-Liner-Curator
          ref: main
          persist-credentials: false
          path: archive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source-scoped, read-only audit export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cd archive
          node tools/search/internal-link-audit.mjs --json > ../output/internal-link-audit.json
          python3 scripts/historical-consistency-monitor.py --root . --output ../output/historical-consistency-report.md --csv ../output/historical-consistency-findings.csv
          python3 ../curator-os/tools/stewardship/normalize-chronology-csv.py ../output/historical-consistency-findings.csv ../output/chronology-normalized.json
          REVISION=$(git rev-parse HEAD)
          node ../curator-os/tools/stewardship/build-ship-guide-inventory.mjs \
            --sitemap sitemaps/sitemap-ships.xml \
            --links ../output/internal-link-audit.json \
            --chronology ../output/chronology-normalized.json \
            --revision "$REVISION" \
            --output ../output/ship-stewardship.json
          cd ..
          node curator-os/tools/stewardship/verify-ship-export.mjs output/ship-stewardship.json
          printf 'Archive revision: %s\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
          node -e "const d=require('./output/ship-stewardship.json');console.log(d.coverage);require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Guides listed: '+d.coverage.listedGuides+'; link observations: '+d.coverage.linkObservations+'\\n')"
      - name: Publish operator-downloadable audit snapshot (not website content)
        uses: actions/upload-artifact@v4
        with:
          name: ship-stewardship-audit-export
          path: output/ship-stewardship.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_verified_snapshot == true && github.ref == 'refs/heads/main' }}
    needs: export
    runs-on: ubuntu-latest
    environment: stewardship-snapshot-publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ship-stewardship-audit-export
          path: output
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshot again before publication
        run: node tools/stewardship/verify-ship-export.mjs output/ship-stewardship.json
      - name: Publish to isolated Cloudflare KV (single fixed key)
        env:
          CF_API_TOKEN: ${{ secrets.STEWARDSHIP_SNAPSHOT_KV_WRITE_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.STEWARDSHIP_CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.STEWARDSHIP_SHIP_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CF_API_TOKEN:?Scoped write token not configured}"
          : "${CF_ACCOUNT_ID:?Cloudflare account not configured}"
          : "${CF_KV_NAMESPACE_ID:?Snapshot namespace not configured}"
          [[ "$CF_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$CF_KV_NAMESPACE_ID" =~ ^[0-9a-f]{32}$ ]]
          RESPONSE=$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
            --request PUT \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @output/ship-stewardship.json \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/verified%3Aship-stewardship%3Av1")
          node -e "const r=JSON.parse(process.argv[1]);if(r.success!==true)process.exit(1)" "$RESPONSE"
          echo 'Validated archive snapshot submitted to isolated protected KV key.' >> "$GITHUB_STEP_SUMMARY"
