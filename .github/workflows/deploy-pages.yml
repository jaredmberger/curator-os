name: Deploy CuratorOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare production site artifact
        run: |
          rm -rf _site
          mkdir -p _site

          cp preview/index.html _site/index.html
          cp preview/rebuilt.css _site/rebuilt.css
          cp preview/rebuilt.js _site/rebuilt.js
          cp preview/manifest.webmanifest _site/manifest.webmanifest
          cp preview/icon.svg _site/icon.svg
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
